<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Accent line -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>
  <!-- Chart icon (simple candlestick/bar chart) -->
  <g transform="translate(80, 120)" fill="none" stroke-linecap="round">
    <!-- Bars -->
    <rect x="0" y="160" width="30" height="80" rx="4" fill="#2563eb" opacity="0.7"/>
    <rect x="50" y="100" width="30" height="140" rx="4" fill="#059669" opacity="0.7"/>
    <rect x="100" y="130" width="30" height="110" rx="4" fill="#2563eb" opacity="0.7"/>
    <rect x="150" y="60" width="30" height="180" rx="4" fill="#059669" opacity="0.7"/>
    <rect x="200" y="90" width="30" height="150" rx="4" fill="#2563eb" opacity="0.7"/>
    <rect x="250" y="40" width="30" height="200" rx="4" fill="#059669" opacity="0.7"/>
    <!-- Trend line -->
    <polyline points="15,200 65,160 115,180 165,120 215,140 265,100" stroke="#f59e0b" stroke-width="4" fill="none" opacity="0.9"/>
  </g>
  <!-- Title -->
  <text x="600" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">最新经济学工作论文</text>
  <!-- Subtitle -->
  <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#94a3b8" text-anchor="middle" letter-spacing="0.02em">Latest Economics Working Papers</text>
  <!-- Sources -->
  <g transform="translate(600, 500)" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b">
    <text x="-180" y="0">NBER</text>
    <circle cx="-140" cy="-6" r="4" fill="#059669"/>
    <text x="-100" y="0">CEPR</text>
    <circle cx="-60" cy="-6" r="4" fill="#2563eb"/>
    <text x="-20" y="0">OECD</text>
    <circle cx="20" cy="-6" r="4" fill="#f59e0b"/>
    <text x="60" y="0">Oxford</text>
    <circle cx="130" cy="-6" r="4" fill="#16a34a"/>
    <text x="170" y="0">ADB</text>
    <circle cx="210" cy="-6" r="4" fill="#dc2626"/>
  </g>
  <!-- Footer -->
  <text x="600" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle">Yuxin Wen · PhD candidate in Economics · Zhejiang University</text>
</svg>
