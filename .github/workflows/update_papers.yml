name: Update Economics Papers

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0点运行
  workflow_dispatch:      # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Chromium (for DrissionPage)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 feedparser DrissionPage

      - name: Run ADB Working Papers crawler
        run: python scripts/adb_crawler.py --pages 5 --headless

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/adb_papers.json
          git add _data/papers_data.json
          git commit -m "Daily update: ADB working papers" || exit 0
          git push
