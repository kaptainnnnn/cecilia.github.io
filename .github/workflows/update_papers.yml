name: Update Economics Papers

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0点运行（北京时间早上8点）
  workflow_dispatch:      # 允许手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Chromium + xvfb (virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser xvfb

      - name: Install Python dependencies
        run: pip install DrissionPage requests

      - name: Run ADB Working Papers crawler
        run: xvfb-run python scripts/adb_crawler.py --pages 2

      - name: Run Oxford Working Papers crawler
        run: xvfb-run python scripts/ox_crawler.py --pages 2

      - name: Run OECD Working Papers crawler
        run: python scripts/oecd_crawler.py --pages 5

      - name: Run NBER Working Papers crawler
        run: xvfb-run python scripts/nber_crawler.py --pages 2

      - name: Run NBER Conferences crawler
        run: xvfb-run python scripts/nber_conference_crawler.py --pages 2

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/adb_papers.json
          git add _data/ox_papers.json
          git add _data/oecd_papers.json
          git add _data/nber_papers.json
          git add _data/nber_conferences.json
          git commit -m "Daily update: working papers & conferences" || exit 0
          git push
