name: Update Economics Papers

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0点运行（北京时间早上8点）
  workflow_dispatch:      # 允许手动触发

permissions:
  contents: write         # 允许提交和推送代码变更

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Chromium + xvfb (virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser xvfb

      - name: Install Python dependencies
        run: pip install DrissionPage requests

      - name: Run ADB Working Papers crawler
        run: xvfb-run python scripts/adb_crawler.py --pages 2

      - name: Run Oxford Working Papers crawler
        run: xvfb-run python scripts/ox_crawler.py --pages 2

      - name: Run OECD Working Papers crawler
        run: python scripts/oecd_crawler.py --pages 5

      - name: Run NBER Working Papers crawler
        run: xvfb-run python scripts/nber_crawler.py --pages 2

      - name: Run NBER Conferences crawler
        run: xvfb-run python scripts/nber_conference_crawler.py --pages 2

      - name: Run CEPR Discussion Papers crawler
        run: xvfb-run python scripts/cepr_crawler.py --pages 5

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _data/adb_papers.json
          git add _data/ox_papers.json
          git add _data/oecd_papers.json
          git add _data/nber_papers.json
          git add _data/nber_conferences.json
          git add _data/cepr_papers.json

          # 检查是否有变更要提交
          if git diff --cached --quiet; then
            echo "没有新数据变更，跳过提交"
            exit 0
          fi

          git commit -m "Daily update: working papers & conferences ($(date +'%Y-%m-%d'))"

          # 显式设置 remote URL 使用 GITHUB_TOKEN
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote set-url origin "${REPO_URL}"

          # 先 pull 再 push（防止冲突）
          git pull --rebase origin main || true
          git push
